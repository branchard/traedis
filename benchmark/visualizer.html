<!doctype html>
<!--
  Shows results.json (written by run.sh) as tables. Browsers refuse to read a
  neighbouring file from a page opened as file://, so serve this directory:
    make bench-view   → http://localhost:8082/visualizer.html
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traedis benchmarks</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: #fcfcfb;
      --text: #0b0b0b;
      --muted: #52514e;
      --rule: #e4e3df;
      --bar: #2a78d6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1a1a19;
        --text: #ffffff;
        --muted: #c3c2b7;
        --rule: #383835;
        --bar: #3987e5;
      }
    }

    body {
      margin: 0;
      padding: 32px 16px 64px;
      background: var(--surface);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      max-width: 920px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    h2 {
      margin: 40px 0 4px;
      font-size: 17px;
    }

    p {
      margin: 0 0 12px;
      color: var(--muted);
    }

    code {
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--rule);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    thead th {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    tbody th {
      font-weight: 600;
    }

    .num {
      text-align: right;
    }

    .muted {
      color: var(--muted);
    }

    /* First row of a backend: a stronger rule above it. */
    tr.group > * {
      border-top: 1px solid var(--muted);
    }

    /* Requests per second, drawn under the number: the scale is the table's fastest case. */
    .bar {
      height: 4px;
      margin-top: 4px;
      border-radius: 2px;
      background: var(--bar);
      min-width: 2px;
      margin-left: auto;
    }

    .gain {
      font-weight: 600;
    }
  </style>
</head>
<body>
<main>
  <h1>Traedis benchmarks</h1>
  <!-- Replaced by the script; stays when the page is opened as file://, where modules do not load. -->
  <p id="status">Nothing to show: run <code>make bench-view</code> and open http://localhost:8082/visualizer.html.</p>
  <div id="report" hidden>
    <h2>Load test through Traefik</h2>
    <p id="load-note"></p>
    <div class="scroll">
      <table id="load"></table>
    </div>

    <h2>Handler under Yaegi</h2>
    <p id="yaegi-note"></p>
    <div class="scroll">
      <table id="yaegi"></table>
    </div>
  </div>
</main>

<script type="module">
  import {
    CASES, LOAD_COLUMNS, YAEGI_COLUMNS, YAEGI_NOTE,
    backends, bytes, duration, gain, loadNote, milliseconds, number, rate, warning,
  } from './report.js';

  // cell appends a cell to row; content is text or a node, never HTML.
  function cell(row, content, className, tag) {
    const el = document.createElement(tag || 'td');
    el.append(content);
    if (className) {
      el.className = className;
    }
    row.append(el);
    return el;
  }

  function head(table, columns) {
    const row = table.createTHead().insertRow();
    for (const [label, className] of columns) {
      cell(row, label, className, 'th');
    }
    return table.createTBody();
  }

  function renderLoad(table, k6) {
    const names = backends(k6);
    const fastest = Math.max(...names.flatMap((b) => Object.values(k6[b]).map((c) => c.requests_per_second)));
    const body = head(table, LOAD_COLUMNS);

    for (const backend of names) {
      const cases = Object.entries(k6[backend]);
      cases.forEach(([name, result], i) => {
        const row = body.insertRow();
        if (i === 0) {
          row.className = 'group';
          cell(row, backend, '', 'th').rowSpan = cases.length;
        }
        cell(row, CASES[name] || name);

        const url = document.createElement('code');
        url.textContent = result.url || '';
        cell(row, url, 'muted');

        const requests = cell(row, rate(result.requests_per_second), 'num');
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.width = (100 * result.requests_per_second / fastest) + '%';
        requests.append(bar);

        cell(row, milliseconds(result.p50_ms), 'num');
        cell(row, milliseconds(result.p95_ms), 'num');

        const versus = cell(row, gain(result.throughput_vs_direct), 'num gain');
        if (warning(result)) {
          const alert = document.createElement('div');
          alert.className = 'muted';
          alert.textContent = warning(result);
          versus.append(alert);
        }
      });
    }
    document.getElementById('load-note').textContent = loadNote(k6);
  }

  function renderYaegi(table, yaegi) {
    const body = head(table, YAEGI_COLUMNS);
    for (const [name, result] of Object.entries(yaegi)) {
      const row = body.insertRow();
      const label = document.createElement('code');
      label.textContent = name;
      cell(row, label, '', 'th');
      cell(row, duration(result.ns_per_op), 'num');
      cell(row, bytes(result.bytes_per_op), 'num');
      cell(row, number(result.allocs_per_op, 0), 'num');
    }
    document.getElementById('yaegi-note').textContent = YAEGI_NOTE;
  }

  async function main() {
    const status = document.getElementById('status');
    try {
      const response = await fetch('results.json', { cache: 'no-store' });
      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }
      const results = await response.json();
      renderLoad(document.getElementById('load'), results.k6);
      renderYaegi(document.getElementById('yaegi'), results.yaegi);

      const modified = response.headers.get('Last-Modified');
      status.textContent = modified ? 'Results of ' + new Date(modified).toLocaleString() + '.' : '';
      document.getElementById('report').hidden = false;
    } catch (error) {
      status.textContent = 'Cannot read results.json (' + error.message + '): run `make bench` first.';
    }
  }

  main();
</script>
</body>
</html>
