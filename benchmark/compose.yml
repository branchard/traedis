# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
# Tools for benchmarking
services:
  # Load generator of benchmark/bench.sh: never started by `docker compose up`, only by `docker compose run k6`
  k6:
    image: grafana/k6:2.3.0
    profiles: [ bench ]
    volumes:
      - ./:/benchmark:ro
    environment:
      - LOAD_VUS
      - LOAD_SECONDS

  # Serves benchmark/ for visualizer.html, which reads results.json → http://localhost:8082/visualizer.html
  # Started by `make bench-view`
  visualizer:
    image: busybox:1.37
    profiles: [ bench ]
    command: httpd -f -p 80 -h /benchmark
    init: true # stops on Ctrl-C
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./:/benchmark:ro
