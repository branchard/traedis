name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: read

# One release at a time: two pushes must not race for the same tag
concurrency:
  group: release

env:
  # vMAJOR.MINOR.PATCH, no leading zeros: what Go modules and the Traefik Plugin Catalog expect
  SEMVER: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

jobs:
  # Reads ./VERSION and fails when it is not a valid version
  parse:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Parse VERSION
        id: version
        run: |
          version="$(<VERSION)"
          if [[ ! "$version" =~ $SEMVER ]]; then
            echo "::error file=VERSION::'$version' is not a valid version (expected vMAJOR.MINOR.PATCH, e.g. v1.2.3)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Is the version a new one, and does it follow the highest released one?
  check:
    needs: parse
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.tags.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - name: Compare with the released versions
        id: tags
        env:
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          set -euo pipefail

          tags="$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||')"
          if grep -qxF "$VERSION" <<< "$tags"; then
            echo "$VERSION is already released: nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Incremental: the next patch, minor or major of the highest released version
          latest="$(grep -E "$SEMVER" <<< "$tags" | sort -V | tail -n 1 || true)"
          if [[ "$latest" =~ $SEMVER ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            next_patch="v$major.$minor.$((patch + 1))"
            next_minor="v$major.$((minor + 1)).0"
            next_major="v$((major + 1)).0.0"
            if [[ "$VERSION" != "$next_patch" && "$VERSION" != "$next_minor" && "$VERSION" != "$next_major" ]]; then
              echo "::error file=VERSION::$VERSION does not follow $latest (expected $next_patch, $next_minor or $next_major)"
              exit 1
            fi
          fi

          echo "new=true" >> "$GITHUB_OUTPUT"

  # Creates the tag and the GitHub release
  release:
    needs: [ parse, check ]
    # Disabled for now. To start releasing, replace with: needs.check.outputs.new == 'true'
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.parse.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
