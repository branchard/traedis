# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3-file-provider.json
http:
  middlewares:
    cache:
      plugin:
        traedis:
          redis:
            dsn: "redis://cache:6379/0"
            timeout: 50ms
          statusCodes: [ 200 ]
          defaultTtl: 5m
          staleTtl: 1h
          maxBodyBytes: 5242880
          exposeKey: false
