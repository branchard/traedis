# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3-file-provider.json
http:
  routers:
    whoami-cache:
      rule: PathPrefix(`/whoami-cache`)
      middlewares:
        - cache
      service: whoami
    whoami:
      rule: PathPrefix(`/whoami`)
      service: whoami

  services:
    whoami:
      loadBalancer:
        servers:
          - url: "http://whoami:80"
