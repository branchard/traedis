# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3-file-provider.json
http:
  routers:
    imaging-cache:
      rule: PathPrefix(`/imaging-cache`)
      middlewares:
        - imaging-cache # before the prefix is stripped: the cache key is the public URL
        - imaging-prefix
      service: imaging
    imaging:
      rule: PathPrefix(`/imaging`)
      middlewares:
        - imaging-prefix
      service: imaging

  middlewares:
    # The backend serves /<signature>/<processing options>/plain/<source URL>
    imaging-prefix:
      stripPrefix:
        prefixes:
          - /imaging-cache
          - /imaging
    imaging-cache:
      plugin:
        traedis:
          redis:
            dsn: "redis://cache:6379/0"

  services:
    imaging:
      loadBalancer:
        servers:
          - url: "http://imaging:8080"
