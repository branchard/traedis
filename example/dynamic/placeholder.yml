# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3-file-provider.json
http:
  routers:
    placeholder-cache:
      rule: PathPrefix(`/placeholder-cache`)
      middlewares:
        - placeholder-cache # before the prefix is stripped: the cache key is the public URL
        - placeholder-prefix
      service: placeholder
    placeholder:
      rule: PathPrefix(`/placeholder`)
      middlewares:
        - placeholder-prefix
      service: placeholder

  middlewares:
    # The backend serves /<width>x<height>
    placeholder-prefix:
      stripPrefix:
        prefixes:
          - /placeholder-cache
          - /placeholder
    placeholder-cache:
      plugin:
        traedis:
          redis:
            dsn: "redis://cache:6379/1"

  services:
    placeholder:
      loadBalancer:
        servers:
          - url: "http://placeholder:3000"
