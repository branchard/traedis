# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3-file-provider.json
http:
  routers:
    placeholder:
      rule: PathPrefix(`/`)
      middlewares:
        - ratelimit # before the cache: random URLs are misses that reach the backend
        - cache
      service: placeholder

  middlewares:
    ratelimit:
      rateLimit:
        average: 50 # requests per second per client IP
        burst: 100

  services:
    placeholder:
      loadBalancer:
        servers:
          - url: "http://placeholder:3000"
