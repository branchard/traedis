# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3-file-provider.json
http:
  middlewares:
    cache:
      plugin:
        traedis:
          # All keys are optional
          redis:
            dsn: "redis://cache:6379/0"                # Redis connection string, including optional credentials and database number
            timeout: 50ms                              # Maximum time allowed for a Redis operation before bypassing the cache
          cache:
            allowedHttpMethods:                        # HTTP methods allowed to get cached
              - GET
              - HEAD
            allowedStatusCodes:                        # HTTP status codes allowed to get cached
              - 200
              - 301
              - 404
            defaultCacheControl: "public, max-age=300" # Cache-Control value used when the backend does not provide one
            key:
              includeBody: false                       # Do not include the request body in the cache key by default
              includeHost: true                        # Include the request host to prevent collisions between virtual hosts
              includeMethod: true                      # Include the HTTP method in the cache key
              includeQuery: true                       # Include query parameters in the cache key
              sortQuery: true                          # Sort query parameters so equivalent URLs generate the same cache key
              includeScheme: true                      # Include the request scheme (HTTP or HTTPS) in the cache key
              hash: true                               # Hash the generated cache key before storing it in Redis
              headers: [ ]                             # Additional request headers that should always participate in the cache key
              expose: false                            # Do not expose the internal cache key in response headers by default
              template: ""                             # Optional custom cache-key template; empty uses the standard key generator
            maxCacheableBodyBytes: 5242880             # Maximum response body size to cache, in bytes (5 MiB)
            stale: 1h                                  # Maximum time an expired cached response may remain available as stale content
            ttl: 5m                                    # Default lifetime of a cached response when no more specific TTL is available