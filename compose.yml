# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
# This file is used for testing during development
services:
  ingress:
    image: traefik:v3.7
    ports:
      - "8080:80"
      - "8081:8080"
    volumes:
      - ./example/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./example/dynamic:/etc/traefik/dynamic:ro

  cache:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - http-cache:/data
    environment:
      - REDIS_ARGS=--maxmemory 512mb --maxmemory-policy allkeys-lfu

  insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    environment:
      RI_REDIS_HOST: cache
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: Cache
      RI_REDIS_USERNAME: default
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    volumes:
      - insight:/data

  placeholder:
    image: ghcr.io/branchard/open-placeholder:latest

volumes:
  http-cache:
  insight:
